# Configuration optimized for ball detection using specialized model + ensemble
#
# This config enables the ball specialist detector and ensemble fusion
# to significantly improve ball detection rate (from ~0.4% to >20%).
#
# Usage:
#   python src/cli.py --video match.mp4 --config configs/ball_specialist.yaml --output runs/test
#
# Requirements:
#   - huggingface_hub package: pip install huggingface_hub
#   - Model auto-downloads from HuggingFace Hub (~6MB)

video:
  sampling_strategy: "every_frame"
  sampling_interval: 1
  target_fps: null

detection:
  model_name: "yolov8x.pt"  # YOLOv8 extra-large for players
  device: "mps"  # Options: "mps" (Apple Silicon), "cuda" (NVIDIA), "cpu"
  confidence_threshold: 0.5  # Player confidence threshold
  batch_size: 8
  player_class_id: 0  # COCO person class
  ball_class_id: 32  # COCO sports ball class

  # Ball detection boost settings (used by YOLODetector)
  ball:
    confidence_threshold: 0.15  # Lower threshold for small ball detection
    enable_multiscale: false  # Disabled when using ensemble
    scales: [0.5, 1.0, 1.5]
    merge_iou_threshold: 0.5
    enable_temporal_filter: true  # Keep temporal filtering
    temporal_window_size: 5
    max_frame_displacement: 100.0
    min_temporal_confirmations: 2
    enable_candidate_tracking: true  # Keep candidate tracking
    candidate_min_hits: 3
    candidate_max_age: 5
    max_size_ratio: 0.05
    max_aspect_ratio: 3.0

  # Ball specialist detector (ENABLED)
  ball_specialist:
    enabled: true
    model_source: "keremberke/yolov8n-soccer-ball-detection"  # Specialized soccer ball model
    confidence_threshold: 0.25  # Lower than default for better recall
    ball_class_id: 0
    max_size_ratio: 0.08
    max_aspect_ratio: 3.0
    cache_dir: "models"

  # Detector ensemble with WBF (ENABLED)
  ensemble:
    enabled: true
    weights:
      yolo: 1.0
      ball_specialist: 2.0  # Higher weight for specialist (better at balls)
    iou_threshold: 0.5
    skip_box_threshold: 0.01
    fusion_type: "wbf"  # Weighted Box Fusion

tracking:
  algorithm: "bytetrack"
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3

team:
  method: "color_clustering"
  n_clusters: 2
  our_team_color: null
  opponent_color: null

events:
  detect_shots: true
  detect_goals: true
  detect_passes: false
  detect_set_pieces: true
  shot_velocity_threshold: 5.0
  goal_confidence_threshold: 0.7

  goal_region:
    enabled: true
    detection_method: "hybrid"
    heuristic_edge_margin: 0.15
    heuristic_goal_width_fraction: 0.30
    canny_low_threshold: 50
    canny_high_threshold: 150
    hough_threshold: 100
    hough_min_line_length: 100
    hough_max_line_gap: 10
    line_angle_tolerance: 15.0
    white_hsv_low: [0, 0, 200]
    white_hsv_high: [180, 30, 255]
    min_goalpost_height: 0.05
    goalpost_aspect_ratio_min: 3.0
    enable_temporal_smoothing: true
    smoothing_window_frames: 30
    max_frame_displacement: 50.0
    fallback_confidence_threshold: 0.3
    blend_threshold: 0.6
    interpolation_max_gap: 60

overlay:
  bbox_thickness: 2
  show_confidence: true
  show_track_ids: true
  show_team_colors: true
  player_color: "#00FF00"
  ball_color: "#FF0000"
  trail_length: 30

export:
  save_detections: true
  save_tracks: true
  save_events: true
  save_overlay_video: true
  detections_format: "parquet"
  video_codec: "mp4v"
  video_fps: null

cache_dir: ".cache"
output_dir: "runs"
enable_cache: true
